name: FastAPI CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy black isort flake8 httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


      - name: Run Unittests
        run: pytest tests

      - name: Run Mypy
        run: mypy src/

      - name: Run Black
        run: black --diff --check src/

      - name: Run Isort
        run: isort --check-only src/

      - name: Run Flake8
        run: flake8 src/